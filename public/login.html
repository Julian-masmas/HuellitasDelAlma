<!DOCTYPE html>

<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="../src/css/login.css">
</head>

<body>
    <h1>Inicio de Sesión</h1>
    <div>
        <img src="../src/assets/Logo_veterinaria.png" alt="Logo app">
    </div>
    <form>
        <div class="formulario">
            <label for="email">Correo: </label>
            <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
        </div>
        <div class="formulario">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" minlength="8" required>
        </div>
        <div class="boton">
            <input type="submit" value="Inicio" required>
        </div>
    </form>
</body>
<script src="index.js" type="module"></script>

</html>
