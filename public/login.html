<!DOCTYPE html>

<html>

<head>
    <title>Login</title>
    <link rel="stylesheet" href="/src/css/login.css">
    <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-auth-compat.js"></script>
    <script src="/src/js/login.js"></script>
</head>

<body>
    <h1>Inicio de Sesión</h1>
    <a href="index.html" class="logo_btn">
        <img src="../src/assets/Logo_veterinaria.png" alt="Logo app">
    </a>
    <form>
        <div id="login-error"></div>
        <div class="formulario">
            <label for="email">Correo: </label>
            <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
        </div>
        <div class="formulario">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" placeholder="Contraseña" minlength="8" required>
        </div>
        <div class="boton">
            <button id="login_btn">Inicio</button>
        </div>
    </form>
</body>
</html>
