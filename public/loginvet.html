<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login de Veterinaria</title>
  <link rel="stylesheet" href="../src/css/register.css" />
</head>
<body>
  <h1>Login de Veterinaria</h1>

  <a href="index.html" class="logo_btn">
    <img src="../src/assets/Logo_veterinaria.png" alt="Logo app" />
  </a>

  <form id="loginForm">
    <div class="formulario">
      <label for="email">Correo:</label>
      <input type="email" id="email" placeholder="Correo electrónico" required />
    </div>

    <div class="formulario">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" placeholder="Contraseña" minlength="8" required />
    </div>

    <div class="boton">
      <button type="button" id="login_btn">Iniciar Sesión</button>
    </div>
  </form>

  <!-- Carga de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.8.1/firebase-database-compat.js"></script>

  <!-- Inicialización de Firebase -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAQgYiQo-qzBkr7jFBUUORr01ImBX-SIk8",
      authDomain: "huellitasdelalma-60cfb.firebaseapp.com",
      databaseURL: "https://huellitasdelalma-60cfb-default-rtdb.firebaseio.com",
      projectId: "huellitasdelalma-60cfb",
      storageBucket: "huellitasdelalma-60cfb.appspot.com",
      messagingSenderId: "1010111418840",
      appId: "1:1010111418840:web:33efac312ca4dd6de022ad",
      measurementId: "G-NV6YYVFJS3"
    };

    firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Script para iniciar sesión -->
  <script src="../src/js/loginvet.js"></script>
</body>
</html>
