<body>
    <h1>Registro de Veterinaria</h1>
    <a href="index.html" class="logo_btn">
        <img src="../src/assets/Logo_veterinaria.png" alt="Logo app">
    </a>
    <form id="registroForm">
        <div class="formulario">
            <label for="username">Nombre: </label>
            <input type="text" name="username" id="username" placeholder="Escribe el nombre de tu organizacion" required>
        </div>
        <div class="formulario">
            <label for="nit">Matricula mercantil (NIT): </label>
            <input type="number" name="matricula_mercantil" id="nit" placeholder="Numero de matricula mercantil" required>
        </div>
        <div class="formulario">
            <label for="email">Correo: </label>
            <input type="email" name="email" id="email" placeholder="Correo electrónico" required>
        </div>
        <div class="formulario">
            <label for="password">Contraseña: </label>
            <input type="password" name="password" id="password" placeholder="Contraseña" minlength="8" required>
        </div>
        <div class="formulario">
            <label for="cellphone">Celular: </label>
            <input type="text" name="cellphone" id="cellphone" placeholder="Celular" minlength="10" required>
        </div>
        <div class="formulario">
            <label for="direccion">Direccion: </label>
            <input type="text" name="direccion" id="direccion" placeholder="Escribe tu direccion" required>
        </div>
        <div class="boton">
            <button type="button" id="register_btn">Registrarse</button>
        </div>
    </form>

    <!-- Script de registro -->
    <script src="../src/js/registerVet.js"></script>
</body>
</html>
